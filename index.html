ce Analyst, Westport, Co. Mayo.","company_name":"Carraig Donn","location":"Westport, County Mayo, Ireland","employment_type":"Full-time","seniority_level":"Not Applicable","date_posted":"2026-08-28","number_of_applicants":"144","job_link":"https://ie.linkedin.com/jobs/view/junior-business-performance-analyst-westport-co-mayo-at-carraig-donn-4459423492?position=6&pageNum=0&refId=p%2Bla4pohFOx0NIfuqTgQeA%3D%3D&trackingId=AgnSC1pPr4ddaSBUso3AIw%3D%3D","match_score":10,"fit_reason":"Weak fit: limited skill overlap or seniority mismatch."}];let sortKey='match_score',sortDir=-1;const locSet=new Set(jobs.map(j=>j.location).filter(Boolean));const locF=document.getElementById('locF');locSet.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;locF.appendChild(o)});function render(){const q=document.getElementById('q').value.toLowerCase();const loc=locF.value;const type=document.getElementById('typeF').value;const strong=document.getElementById('strongF').checked;const sorted=[...jobs].sort((a,b)=>sortDir*(a[sortKey]>b[sortKey]?1:a[sortKey]<b[sortKey]?-1:0));const tb=document.getElementById('tb');tb.innerHTML='';sorted.forEach(j=>{const txt=(j.job_title+j.company_name+j.location+j.fit_reason).toLowerCase();if(q&&!txt.includes(q))return;if(loc&&j.location!==loc)return;if(type){const lv=(j.seniority_level+j.employment_type).toLowerCase();if(!lv.includes(type))return;}if(strong&&j.match_score<75)return;const sc=j.match_score>=75?'g':j.match_score>=60?'y':'r';const tr=document.createElement('tr');tr.innerHTML=`<td><span class="pill ${sc}">${j.match_score}</span></td><td class="fr">${j.fit_reason}</td><td><strong style="color:#fff">${j.job_title}</strong></td><td style="color:#ccc">${j.company_name}</td><td style="color:#999">${j.location}</td><td><span class="badge">${j.employment_type||'N/A'}</span><span class="badge">${j.seniority_level||'N/A'}</span></td><td style="color:#aaa">${j.number_of_applicants||'-'}</td><td style="color:#aaa;white-space:nowrap">${j.date_posted||'-'}</td><td>${j.job_link?`<a class="btn" href="${j.job_link}" target="_blank" rel="noopener">View</a>`:'N/A'}</td>`;tb.appendChild(tr);});}document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.getAttribute('data-k');if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='match_score'?-1:1;}render();}));['q','locF','typeF','strongF'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
