td><td>${j.job_link?`<a class="btn" href="${j.job_link}" target="_blank" rel="noopener">View</a>`:'N/A'}</td>`;tb.appendChild(tr);});}document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.getAttribute('data-k');if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='match_score'?-1:1;}render();}));['q','locF','typeF','strongF'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
