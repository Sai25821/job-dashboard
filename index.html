_score<75)return;const sc=j.match_score>=75?'g':j.match_score>=60?'y':'r';const tr=document.createElement('tr');tr.innerHTML=`<td><span class="pill ${sc}">${j.match_score}</span></td><td class="fr">${j.fit_reason}</td><td><strong style="color:#fff">${j.job_title}</strong></td><td style="color:#ccc">${j.company_name}</td><td style="color:#999">${j.location}</td><td><span class="badge">${j.employment_type||'N/A'}</span><span class="badge">${j.seniority_level||'N/A'}</span></td><td style="color:#aaa">${j.number_of_applicants||'-'}</td><td style="color:#aaa;white-space:nowrap">${j.date_posted||'-'}</td><td>${j.job_link?`<a class="btn" href="${j.job_link}" target="_blank" rel="noopener">View</a>`:'N/A'}</td>`;tb.appendChild(tr);});}document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.getAttribute('data-k');if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='match_score'?-1:1;}render();}));['q','locF','typeF','strongF'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
